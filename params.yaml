prepare:
  test_fraction: 0.2

train:
  model: hist_gb # linear_ridge | random_forest | hist_gb
  target_transform: log1p

  linear_ridge:
    alpha: 10.0
    select_k: 20 # 0 — без отбора

  random_forest:
    n_estimators: 300
    max_depth: 20
    min_samples_leaf: 3
    random_state: 42
    n_jobs: -1

  hist_gb:
    max_iter: 400
    max_depth: 6
    learning_rate: 0.05
    random_state: 42

evaluate:
  min_r2: 0.0
