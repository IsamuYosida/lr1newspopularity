[project]
name = "lr1newspopularity"
version = "0.1.0"
description = "Лабораторные работы MLOps, вариант 7 — Online News Popularity"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26",
    "scikit-learn>=1.5,<1.7",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "dvc[s3]>=3.55,<4.0",
    "pandera>=0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
